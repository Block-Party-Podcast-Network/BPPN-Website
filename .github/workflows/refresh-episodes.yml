name: Refresh episodes

# Re-runs `npm run fetch:episodes` on a schedule and commits data/episodes.json
# only when episode content actually changed (timestamps alone don't count).
# The push then triggers a redeploy on whatever host is watching main.

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: cp data/episodes.json "$RUNNER_TEMP/episodes.before.json"

      - run: npm run fetch:episodes

      - name: Commit if episodes changed
        run: |
          strip='del(.generatedAt) | del(.shows[].lastFetchedAt)'
          if diff -q <(jq -S "$strip" "$RUNNER_TEMP/episodes.before.json") <(jq -S "$strip" data/episodes.json) >/dev/null; then
            echo "No episode changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "Refresh episodes"
          git push
