name: Refresh episodes

# Re-runs `npm run fetch:episodes` on a schedule and commits public/data/
# (episodes.json plus each show's archive in shows/) only when episode content
# actually changed (timestamps alone don't count).
# The push then triggers a redeploy on whatever host is watching main.

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: cp -R public/data "$RUNNER_TEMP/data.before"

      - run: npm run fetch:episodes

      - name: Commit if episodes changed
        run: |
          strip='walk(if type == "object" then del(.generatedAt, .lastFetchedAt) else . end)'
          normalize() {
            (cd "$1" && find . -name '*.json') | while read -r f; do
              mkdir -p "$2/$(dirname "$f")"
              jq -S "$strip" "$1/$f" > "$2/$f"
            done
          }
          normalize "$RUNNER_TEMP/data.before" "$RUNNER_TEMP/before"
          normalize public/data "$RUNNER_TEMP/after"
          if diff -rq "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" >/dev/null; then
            echo "No episode changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh episodes"
          git push
